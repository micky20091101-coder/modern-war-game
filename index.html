<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>现代国家 · 自发展战争（网页版）</title>
    <style>
      /* ===== Palette: light = space-4/5 values; dark = pure black spec ===== */
      :root {
        color-scheme: light dark;
        --bg: #f2f2f7;
        --surface: #ffffff;
        --surface-2: #f2f2f7;
        --fill: #f8f8fa;
        --fill-2: #f2f2f7;
        --seg-track: rgba(120,120,128,0.12);
        --text: #1c1c1e;
        --dim: #6e6e73;
        --border: #e3e3e8;
        --accent: #007aff;
        --good: #34c759;
        --bad: #ff3b30;
        --warn: #ff9500;
        --radius: 20px;
        --spring: cubic-bezier(0.32, 0.72, 0, 1);
        --magnet: cubic-bezier(0.65, 0, 0.35, 1);
        --overshoot: cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --surface: #1c1c1e;
          --surface-2: #2c2c2e;
          --fill: #2c2c2e;
          --fill-2: #1c1c1e;
          --seg-track: rgba(120,120,128,0.24);
          --text: #ffffff;
          --dim: #98989f;
          --border: #38383a;
          --accent: #0a84ff;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; overscroll-behavior: none; }
      body {
        margin: 0;
        background: #0a283d; /* ocean tone behind the fullscreen map */
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: var(--text);
      }
      button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
      button:disabled { cursor: default; }
      .pt-safe { padding-top: env(safe-area-inset-top); }

      /* ===== Motion package keyframes (theme.css, verbatim values) ===== */
      @keyframes sheetIn { from { opacity: 0; transform: translateY(30px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .sheet-in { animation: sheetIn 340ms var(--overshoot); }
      /* Q-pop for panels/pills: OVERSHOOT 340ms drives GEOMETRY only
         (scale/translate, slight overshoot); colors never overshoot.
         Closing runs on the main spring, faster and without overshoot. */
      @keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(0.9); } 55% { opacity: 1; } to { opacity: 1; transform: translateY(0) scale(1); } }
      .pop-in { animation: popIn 340ms var(--overshoot); transform-origin: 50% 100%; }
      .pop-in-top { animation: popIn 340ms var(--overshoot); transform-origin: 50% 0; }
      .pop-out { transform: translateY(10px) scale(0.94) !important; opacity: 0 !important; transition: transform 200ms var(--spring), opacity 200ms var(--spring) !important; }
      .sheet { transition: transform 230ms var(--spring), opacity 230ms var(--spring); }
      .sheet-out { transform: translateY(42px) !important; opacity: 0 !important; }
      .sheet-grab { display: flex; justify-content: center; padding: 2px 0 10px; cursor: grab; touch-action: none; }
      .sheet-grab span { width: 42px; height: 5px; border-radius: 999px; background: rgba(128,128,128,0.45); display: block; }
      @keyframes modalIn { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .modal-in { animation: modalIn 550ms var(--spring); }
      @keyframes frontPulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.85; } }
      @keyframes rainFall { 0% { transform: translateY(-4px); opacity: 0; } 25% { opacity: 0.85; } 100% { transform: translateY(16px); opacity: 0; } }
      @keyframes snowFall { 0% { transform: translate(0, -4px); opacity: 0; } 25% { opacity: 0.95; } 55% { transform: translate(2.5px, 6px); } 100% { transform: translate(-1px, 15px); opacity: 0; } }
      @keyframes stormFlash { 0%, 88%, 94%, 100% { opacity: 0; } 90%, 92% { opacity: 0.55; } }
      @keyframes flagPop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
      @keyframes clashPulse { 0% { transform: scale(0.55); opacity: 0.9; } 100% { transform: scale(1.6); opacity: 0; } }
      .flow-line { stroke-dasharray: 7 7; animation: flowDash 0.9s linear infinite; }
      @keyframes flowDash { to { stroke-dashoffset: -14; } }
      /* Battle visibility set: flow guide dashes MARCH toward the target
         (dash period 9+7=16, so -16 loops seamlessly), war flames flicker. */
      @keyframes flowMarch { to { stroke-dashoffset: -16; } }
      @keyframes flameFlick { from { transform: scale(1); } to { transform: scale(1.14); } }
      .pop-title { font-size: 12px; font-weight: 700; color: var(--dim); margin: 0 2px 6px; }
      .legend-sep { width: 1px; align-self: stretch; background: var(--hair); }
      .lsw-fire { background: radial-gradient(circle at 50% 62%, #ffd75e 1.5px, #ff6a00 3.5px, #e03a00 6px, transparent 7px); }
      .resbar { flex-wrap: wrap; row-gap: 10px; }
      @media (prefers-reduced-motion: reduce) { .flow-line { animation: none; } }
      @keyframes gatherPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

      /* ===== Dock — motion package ch.1 layer accounting (web stack).
         Bar, bottom→top (§1.2): (1) live backdrop: backdrop-filter
         blur(26px) saturate(1.8) — the browser composites the REAL page
         behind the bar, no bitmap layer to skip, so the §1.4 DarkGlass
         bitmap branch never triggers and no solid ever fills in;
         (2) double outer shadow 40/16/.16 + 10/3/.08 (dark .55/.40);
         (3) tint gradient 155° #66/#40/#59FFFFFF (dark capped
         #33/#22/#28 48484A-family); (4) gloss gradient 115°
         #59/#0D/#00FFFFFF (dark #14/#08/#00), fixed, never follows the
         finger; (5) 0.5px border #B3FFFFFF (dark #22) + top 1px
         highlight ::before #F2FFFFFF (dark #26) inset 8px each side,
         clipped inside the pill radius + inset bottom dark line
         rgba(0,0,0,.06). Every alpha is a composite alpha — no solid
         backing anywhere (red line 15). Palette switches ONLY on
         prefers-color-scheme (the app appearance), never on content.
         Pill = EXACTLY 4 layers (§1.3): double shadow (10/3/.10 +
         3/1/.06) → translucent fill #F2FFFFFF (dark #8C787880 =
         rgba(120,120,128,.55)) → 0.5px border #B3 (dark #22) → top
         1px highlight ::after #F2 (dark #4D) inset 4px. No gloss, no
         own backdrop on the pill. ===== */
      .dock-glass {
        background:
          linear-gradient(115deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.05) 38%, rgba(255,255,255,0) 62%),
          linear-gradient(155deg, rgba(255,255,255,0.40) 0%, rgba(255,255,255,0.25) 55%, rgba(255,255,255,0.35) 100%);
        -webkit-backdrop-filter: blur(26px) saturate(1.8);
        backdrop-filter: blur(26px) saturate(1.8);
        border: 0.5px solid rgba(255,255,255,0.70);
        box-shadow: 0 16px 40px rgba(0,0,0,0.16), 0 3px 10px rgba(0,0,0,0.08), inset 0 -0.5px 0 rgba(0,0,0,0.06);
        border-radius: 999px;
      }
      /* Highlight geometry fix (user screenshot 03:22): the bar is a
         999px-radius capsule 61px tall, so at y=0 its silhouette is only
         ~21px wide in the middle — a straight 1px line inset just 8px
         poked OUTSIDE the rounded ends and read as a stray full-width
         line across the top. The line now sits at top:1px, inset 24px
         each side (inside the silhouette at that height) and its ends
         fade out through a gradient, so it can never reach the curve. */
      .dock-glass::before {
        content: ""; position: absolute; top: 1px; left: 24px; right: 24px; height: 1px; border-radius: 999px;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.95) 16%, rgba(255,255,255,0.95) 84%, rgba(255,255,255,0) 100%); pointer-events: none;
      }
      .dock-pill {
        background: rgba(255,255,255,0.95);
        border: 0.5px solid rgba(255,255,255,0.70);
        box-shadow: 0 3px 10px rgba(0,0,0,0.10), 0 1px 3px rgba(0,0,0,0.06);
        border-radius: 999px;
      }
      /* Same defect on the pill (inset was 4px on a 53px-tall capsule:
         the line floated wider than the pill's top curve — the short
         stray line in the screenshot). Inset 20px + faded ends. */
      .dock-pill::after {
        content: ""; position: absolute; top: 1px; left: 20px; right: 20px; height: 1px; border-radius: 999px;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.95) 22%, rgba(255,255,255,0.95) 78%, rgba(255,255,255,0) 100%); pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        .dock-glass {
          background:
            linear-gradient(115deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 38%, rgba(255,255,255,0) 62%),
            linear-gradient(155deg, rgba(72,72,74,0.20) 0%, rgba(44,44,46,0.13) 55%, rgba(58,58,60,0.16) 100%);
          border-color: rgba(255,255,255,0.13);
          box-shadow: 0 16px 40px rgba(0,0,0,0.55), 0 3px 10px rgba(0,0,0,0.40), inset 0 -0.5px 0 rgba(0,0,0,0.06);
        }
        .dock-glass::before { background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 16%, rgba(255,255,255,0.15) 84%, rgba(255,255,255,0) 100%); }
        .dock-pill { background: rgba(120,120,128,0.55); border-color: rgba(255,255,255,0.13); }
        .dock-pill::after { background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.30) 22%, rgba(255,255,255,0.30) 78%, rgba(255,255,255,0) 100%); }
      }
      /* identity + card helpers (readability pass) */
      .me-badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: #ffd75e; color: #4a3500; font-size: 11px; font-weight: 800; vertical-align: 2px; }
      .legend-row { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; padding: 7px 12px; border-radius: 14px; }
      .legend-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
      .legend-chip .lsw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
      .chip-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .chip-lab { font-size: 12px; color: var(--dim); font-weight: 700; }
      .u-chip { background: var(--fill); border-radius: 8px; padding: 2px 8px; font-size: 12.5px; font-weight: 600; }
      .bicons { display: inline-flex; gap: 4px; vertical-align: middle; }
      .bicon { position: relative; width: 24px; height: 24px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: var(--fill); color: var(--dim); opacity: 0.4; }
      .bicon.on { opacity: 1; background: rgba(0,122,255,0.16); color: var(--text); }
      .bicon i { position: absolute; top: -5px; right: -5px; background: #ff9500; color: #fff; border-radius: 999px; font-size: 10px; font-style: normal; padding: 0 4px; font-weight: 800; line-height: 1.5; }
      .grp-lab { font-size: 12px; font-weight: 700; color: var(--dim); margin: 10px 0 6px; }
      .opt-ic { display: inline-flex; width: 22px; height: 22px; border-radius: 6px; background: rgba(0,122,255,0.14); align-items: center; justify-content: center; font-size: 12px; font-weight: 800; margin-right: 6px; vertical-align: -6px; }
      .prov-card { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 0.5px solid rgba(128,128,128,0.25); }
      .prov-card:first-of-type { border-top: none; }
      .prov-name { font-size: 16.5px; font-weight: 800; margin: 0; }
      .prov-sub { font-size: 12.5px; color: var(--dim); margin: 2px 0 6px; }
      .prov-btns { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
      .prov-btns button { border: none; border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 700; background: var(--fill); color: var(--text); cursor: pointer; }
      .prov-btns button.b1 { background: #007aff; color: #fff; }
      .me-row { background: rgba(255,215,94,0.13); border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
      .hud-glass {
        background: rgba(255,255,255,0.88);
        -webkit-backdrop-filter: blur(20px) saturate(1.6);
        backdrop-filter: blur(20px) saturate(1.6);
        border: 0.5px solid rgba(255,255,255,0.65);
        box-shadow: 0 8px 28px rgba(4,20,30,0.18);
        color: #1c1c1e;
      }
      @media (prefers-color-scheme: dark) {
        .hud-glass { background: rgba(28,28,30,0.88); border-color: rgba(255,255,255,0.13); color: #ffffff; }
        .hud-glass .dim { color: #98989f !important; }
      }
      .hud-dark {
        background: rgba(10,26,38,0.72);
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        backdrop-filter: blur(18px) saturate(1.4);
        border: 0.5px solid rgba(255,255,255,0.22);
        box-shadow: 0 8px 28px rgba(4,20,30,0.25);
        color: #fff;
      }
      .top-scrim { background: linear-gradient(to bottom, rgba(6,22,33,0.42), rgba(6,22,33,0)); pointer-events: none; }

      /* ===== Layout ===== */
      .stage { position: fixed; inset: 0; overflow: hidden; background: #0a283d; }
      .mapwrap { position: absolute; inset: 0; }
      .mapwrap svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
      .hud-col { position: absolute; inset: 0 auto auto 0; width: 100%; pointer-events: none; z-index: 10; }
      .hud-inner { margin: 0 auto; width: 100%; max-width: 760px; padding: max(8px, env(safe-area-inset-top)) 12px 0; }
      .hud-inner > * { pointer-events: auto; }
      .scrim { position: absolute; inset: 0 0 auto 0; height: calc(env(safe-area-inset-top) + 88px); z-index: 5; }

      .name-chip { display: inline-block; border-radius: 16px; padding: 6px 12px; }
      .name-line { font-size: 14px; font-weight: 700; line-height: 1.25; }
      .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
      .tier-badge { margin-left: 8px; border-radius: 999px; background: rgba(255,255,255,0.18); padding: 2px 8px; font-size: 11px; font-weight: 600; }
      .q-line { margin-left: 8px; font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.75); }
      .skip-btn { border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 600; }
      .hud-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }

      .resbar { margin-top: 8px; display: flex; align-items: center; gap: 8px; border-radius: 16px; padding: 8px 12px; }
      .res-cell { flex: 1; min-width: 0; }
      .res-label { font-size: 11px; line-height: 1; color: var(--dim); margin: 0; }
      .hud-glass .res-label { color: #6e6e73; }
      @media (prefers-color-scheme: dark) { .hud-glass .res-label { color: #98989f; } }
      .res-value { font-size: 17px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; white-space: nowrap; margin: 0; }
      /* Overview is a 3-column grid of big numbers — a value must NEVER
         ellipsis-clip (the first overview build squeezed five cells
         into one flex row and 1,200 rendered as "1…"). */
      .top-pop .resbar { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: start; }
      .top-pop .res-div { display: none; }
      .top-pop .res-right { text-align: left; }
      .top-pop .pop-title, .strat-pop .pop-title { color: rgba(255,255,255,0.88); text-shadow: 0 1px 6px rgba(0,0,0,0.35); }
      .res-sub { font-size: 11px; line-height: 1.3; color: var(--dim); font-variant-numeric: tabular-nums; margin: 0; }
      .hud-glass .res-sub { color: #6e6e73; }
      @media (prefers-color-scheme: dark) { .hud-glass .res-sub { color: #98989f; } }
      .res-sub.good { color: #34c759; font-weight: 600; }
      .res-sub.bad { color: #ff3b30; font-weight: 600; }
      .res-div { width: 1px; height: 36px; background: rgba(28,28,30,0.1); flex-shrink: 0; }
      @media (prefers-color-scheme: dark) { .res-div { background: rgba(255,255,255,0.14); } }
      .research-btn { margin-top: 4px; border-radius: 999px; background: var(--accent); padding: 4px 12px; font-size: 11.5px; font-weight: 600; color: #fff; }
      .research-btn:disabled { opacity: 0.35; }
      .res-right { flex-shrink: 0; text-align: right; }

      /* control bar above dock */
      .controlbar { position: absolute; inset: auto 0 calc(max(16px, env(safe-area-inset-bottom)) + 77px) 0; z-index: 20; display: flex; justify-content: center; padding: 0 12px; pointer-events: none; }
      .controlbar .panel { width: 100%; max-width: 560px; border-radius: 22px; padding: 10px; pointer-events: auto; }
      .ctl-row { margin-top: 8px; display: flex; gap: 8px; }
      .advance-btn { height: 48px; flex: 1; border-radius: 999px; background: var(--accent); font-size: 15px; font-weight: 700; color: #fff; }
      .advance-btn:disabled { opacity: 0.4; }
      .toggle-btn { height: 48px; border-radius: 999px; padding: 0 16px; font-size: 14px; font-weight: 600; background: rgba(28,28,30,0.08); color: var(--text); }
      .toggle-btn.on-green { background: #34c759; color: #fff; }
      .toggle-btn.on-red { background: #ff3b30; color: #fff; }
      .hud-glass .toggle-btn { color: #1c1c1e; }
      @media (prefers-color-scheme: dark) { .hud-glass .toggle-btn { color: #fff; background: rgba(255,255,255,0.12); } .hud-glass .toggle-btn.on-green { background: #34c759; } .hud-glass .toggle-btn.on-red { background: #ff3b30; } }
      .ctl-desc { margin: 6px 4px 0; font-size: 11px; line-height: 1.45; color: var(--dim); }
      .hud-glass .ctl-desc { color: #6e6e73; }
      @media (prefers-color-scheme: dark) { .hud-glass .ctl-desc { color: #98989f; } }

      /* ===== Map-first chrome (03:17 layout ruling) =====
         Default state = almost pure map. Everything else collapses to
         small glass pieces in the Dock's material family: top capsule,
         a one-row mini bar above the Dock (strategy button + advance +
         speed pill), zoom buttons live in the SVG, legend folds into
         the capsule's expanded card. Panels pop with OVERSHOOT 340ms
         on geometry only; closing runs the main spring. */
      .capsule { display: inline-flex; align-items: center; border-radius: 999px; padding: 8px 14px; max-width: calc(100vw - 24px); }
      .capsule .name-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .capsule .chev { margin-left: 8px; font-size: 11px; opacity: 0.75; flex-shrink: 0; }
      .top-pop { transform-origin: 50% 0; }
      .minirow { position: absolute; left: 0; right: 0; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 69px); z-index: 20; display: flex; justify-content: center; align-items: center; gap: 8px; padding: 0 12px; pointer-events: none; }
      .minirow > * { pointer-events: auto; }
      .glass-chip { position: relative; height: 44px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; font-size: 13.5px; font-weight: 700; color: var(--text); white-space: nowrap; }
      .glass-chip .sub { font-weight: 600; color: var(--accent); }
      .advance-chip { background: var(--accent); color: #fff; box-shadow: 0 8px 22px rgba(0,90,200,0.35); }
      .speed-pill { padding: 0 6px; gap: 2px; }
      .sp-btn { border-radius: 999px; padding: 5px 9px; font-size: 13px; font-weight: 700; color: var(--dim); line-height: 1; }
      .sp-btn.on { background: rgba(255,255,255,0.95); color: #1c1c1e; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
      @media (prefers-color-scheme: dark) { .sp-btn.on { background: rgba(120,120,128,0.55); color: #fff; } }
      .sp-btn.flow-on { color: #ff3b30; }
      .strat-pop { position: absolute; left: 12px; right: 12px; margin: 0 auto; width: auto; max-width: 560px; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 121px); z-index: 21; border-radius: 22px; padding: 12px; transform-origin: 50% 100%; }
      /* Narrow phones: the three mini-row pieces must fit inside the
         margins — tighter padding/type, never clipped or overlapped. */
      @media (max-width: 430px) {
        .minirow { gap: 6px; padding: 0 8px; }
        .glass-chip { padding: 0 10px; font-size: 12.5px; gap: 4px; }
        .speed-pill { padding: 0 4px; }
        .sp-btn { padding: 5px 6px; font-size: 12.5px; }
      }
      .war-ticker { margin-top: 8px; display: flex; align-items: center; gap: 6px; border-radius: 14px; padding: 6px 8px 6px 12px; width: 100%; }
      .war-ticker .wt-x { margin-left: auto; flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: rgba(128,128,128,0.25); display: flex; align-items: center; justify-content: center; font-size: 12px; color: inherit; }
      .strat-live { margin: 8px 4px 0; font-size: 12px; line-height: 1.5; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* Layered settings: one group per row — small gray group label,
         one control. No text walls; a newcomer finds 打法/托管 in 10s. */
      .pop-lab { font-size: 11px; font-weight: 700; color: var(--dim); margin: 10px 2px 5px; }
      .strat-pop .pop-lab:first-child { margin-top: 0; }
      .host-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
      .host-chip { border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; background: var(--seg-track); color: var(--dim); line-height: 1; }
      .host-chip.on { background: #34c759; color: #fff; }
      .hud-glass .host-chip { color: #6e6e73; }
      .hud-glass .host-chip.on { background: #34c759; color: #fff; }

/* ---------- persistence (localStorage; static-build form factor) ---------- */
const SAVE_KEY = "modern-nations-war-save-v1";
let world = null;      // the live world object (null = setup phase)
let storedLogs = [];   // newest-last; each {id, quarter, kind, text}
let logSeq = 0;

function persist(touchSeen) {
  if (!world) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} return; }
  // Mirror the server save: nation stock numbers round-trip through storage.
  for (const n of Object.values(world.nations)) {
    n.money = Math.round(n.money); n.industry = Math.round(n.industry);
    n.techPoints = Math.round(n.techPoints); n.supply = Math.round(n.supply);
  }
  if (touchSeen !== false) world.lastSeenAt = Date.now();
  for (const l of world.newLogs) storedLogs.push({ id: ++logSeq, quarter: world.quarter, kind: l.kind, text: l.text });
  world.newLogs = [];
  if (storedLogs.length > 240) storedLogs = storedLogs.slice(storedLogs.length - 240);
  world.history = world.history.slice(-48);
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ world: world, logs: storedLogs, logSeq: logSeq }));
  } catch (e) { /* storage full/blocked: game continues in memory */ }
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !data.world || !Array.isArray(data.world.regions)) return null;
    // Rebuild guard (same as server): old-map saves are incompatible.
    if (data.world.regions.length !== REGION_DEFS.length) return null;
    if (!data.world.playerKey || data.world.status === "setup") return null;
    return data;
  } catch (e) { return null; }
}
function restoreSave(data) {
  world = data.world;
  world.newLogs = [];
  world.battleEvents = [];
  storedLogs = Array.isArray(data.logs) ? data.logs : [];
  logSeq = data.logSeq || storedLogs.length;
  migrateWorld(world);
}
/* Old-save migration: saves written before fluid territory (and other
   later fields) existed lack control/strain/flows entirely. Fill every
   missing field with its fresh-game default in ONE place at load time —
   instead of relying on each consumer to defend itself — so an old game
   can immediately pour flows and tick control like a new one. The
   migrated shape is written back by the next persist(). */
function migrateWorld(w) {
  if (!w) return;
  ensureFluid(w); // control{}=100, strain{}=0, flows=[], flowSeq=0 when absent
  if (!w.interventions || typeof w.interventions !== "object") w.interventions = {};
  if (!w.truces || typeof w.truces !== "object") w.truces = {};
  if (!Array.isArray(w.offers)) w.offers = [];
  if (!Array.isArray(w.history)) w.history = [];
  if (w.intelUntil == null) w.intelUntil = 0;
  if (!w.strategy) w.strategy = "balanced";
  if (w.autopilot == null) w.autopilot = true;
  // Saves written before the elimination cleanup: a nation already
  // marked eliminated must have its numbers zeroed on load too.
  for (const n of Object.values(w.nations || {})) {
    if (n.eliminated) { n.money = 0; n.industry = 0; n.techPoints = 0; n.supply = 0; }
  }
  if (Array.isArray(w.flows)) w.flows = w.flows.filter((f) => { const nn = w.nations[f.ownerKey]; return !(nn && nn.eliminated); });
  if (!w.combatStyle || !COMBAT_STYLES[w.combatStyle]) w.combatStyle = "even";
  if (w.charge == null) w.charge = 2;
  if (!w.targetPref || !TARGET_PREFS[w.targetPref]) w.targetPref = "weak";
  if (!w.defenseTier || !DEFENSE_TIERS[w.defenseTier]) w.defenseTier = "standard";
  if (w.priorityTarget === undefined) w.priorityTarget = null;
  if (!w.autoAtk || typeof w.autoAtk !== "object") w.autoAtk = {};
  if (!w.truceUntil || typeof w.truceUntil !== "object") w.truceUntil = {};
  for (const nn of Object.values(w.nations || {})) {
    if (nn.supply == null) nn.supply = 200;
    if (nn.sanctionsLeft == null) nn.sanctionsLeft = 0;
    if (nn.eliminated) nn.supply = 0;
  }
  if (!w.hostFlags || typeof w.hostFlags !== "object") w.hostFlags = { produce: true, research: true, attack: true };
  for (const fk of ["produce", "research", "attack"]) if (w.hostFlags[fk] == null) w.hostFlags[fk] = true;
  if (!w.tier) w.tier = "小国";
}

/* ---------- world creation (createWorld) ---------- */
function createWorld(playerKey) {
  storedLogs = []; logSeq = 0;
  const nations = {};
  const advisors = [];
  const truces = {};
  let advId = 0;
  for (const def of NATION_DEFS) {
    nations[def.key] = {
      key: def.key, name: def.name, color: def.color, personality: def.personality,
      money: 600, industry: 120, techPoints: 0, techLevel: 1,
      supply: 200, sanctionsLeft: 0, eliminated: false,
    };
    for (const adv of def.advisors) {
      advisors.push({ id: ++advId, nationKey: def.key, role: adv.role, name: adv.name, level: 0, xp: 0 });
    }
    if (def.key !== playerKey) truces[def.key] = false;
  }
  /* Master table A6/A7: 17 provinces dealt out (azure 19-23, crimson
     4/7/8/9, emerald 24-27, amber 0/1/2/5), 11 neutral. Every dealt
     province: inf 8 / tank 2; each nation's first-listed province:
     inf 8 / tank 4 / missile 1. Neutral provinces: inf 5 / tank 1.
     No opening buildings anywhere. */
  const firstIdx = {};
  for (let i = 0; i < REGION_DEFS.length; i++) {
    const o = REGION_DEFS[i].owner;
    if (o !== "neutral" && firstIdx[o] == null) firstIdx[o] = i;
  }
  const regions = [];
  for (let i = 0; i < REGION_DEFS.length; i++) {
    const def = REGION_DEFS[i];
    const units = emptyUnits(), buildings = emptyBuildings();
    if (def.owner === "neutral") { units.inf = 5; units.tank = 1; }
    else if (firstIdx[def.owner] === i) { units.inf = 8; units.tank = 4; units.missile = 1; }
    else { units.inf = 8; units.tank = 2; }
    regions.push({ idx: i, name: def.name, type: def.type, ownerKey: def.owner,
      coreOf: def.core ? def.owner : null, buildings: buildings, units: units, weather: "clear", temp: 16 });
  }
  world = {
    playerKey: playerKey, quarter: 0, strategy: "balanced", autopilot: true,
    combatStyle: "even", hostFlags: { produce: true, research: true, attack: true },
    targetPref: "weak", defenseTier: "standard", priorityTarget: null, autoAtk: {},
    charge: 2, truceUntil: {},
    status: "playing", lastSeenAt: Date.now(), tier: "小国", interventions: {},
    intelUntil: 0, history: [], offers: [], nations: nations, regions: regions,
    advisors: advisors, truces: truces, newLogs: [], battleEvents: [],
  };
  ensureFluid(world);
  for (const r of world.regions) {
    const climate = REGION_DEFS[r.idx].climate || "temperate";
    const table = {
      arctic: ["snow", "cloudy", "cloudy", "clear", "fog", "snow"],
      desert: ["clear", "clear", "drought", "cloudy", "clear"],
      tropical: ["rain", "clear", "storm", "cloudy", "rain", "clear"],
      subtropical: ["clear", "cloudy", "rain", "clear", "cloudy"],
      temperate: ["clear", "cloudy", "cloudy", "rain", "clear", "fog"],
    };
    const options = table[climate] || table.temperate;
    r.weather = options[Math.floor(Math.random() * options.length)] || "clear";
    const bandOffset = climate === "arctic" ? -9 : climate === "tropical" ? 7 : climate === "desert" ? 5 : 0;
    r.temp = Math.round(16 + bandOffset + (Math.random() * 9 - 4));
    if (r.weather === "snow") r.temp = Math.min(r.temp, 1);
    if (r.weather === "storm" || r.weather === "rain") r.temp -= 2;
  }
  elog(world, "system", "你已接管" + (world.nations[playerKey] || {}).name + "。国家将按方略自动发展，你随时可以回来干预。");
  const scores = {};
  for (const n of Object.values(world.nations)) scores[n.key] = nationScore(world, n.key);
  world.history.push({ q: 0, money: world.nations[playerKey].money, army: nationArmyPower(world, playerKey),
    regions: ownedRegions(world, playerKey).length, tech: world.nations[playerKey].techLevel, scores: scores });
  persist();
  return world;
}
function wipeWorld() {

/* ---------- derived numbers ---------- */
function ownedRegions(w, key) { return w.regions.filter((r) => r.ownerKey === key); }
function rawPower(units) { return UNIT_KEYS.reduce((s, k) => s + units[k] * UNITS[k].power, 0); }
function totalUnits(units) { return UNIT_KEYS.reduce((s, k) => s + units[k], 0); }
function supplyUsed(units) { return UNIT_KEYS.reduce((s, k) => s + units[k] * UNITS[k].supply, 0); }
function nationUnits(w, key) {
  const total = emptyUnits();
  for (const r of ownedRegions(w, key)) for (const k of UNIT_KEYS) total[k] += r.units[k];
  return total;
}
function advisorOf(w, key, role) { return w.advisors.find((a) => a.nationKey === key && a.role === role); }
function advisorMult(w, key, role) { const a = advisorOf(w, key, role); return 1 + 0.03 * (a ? a.level : 1); }
function nationScore(w, key) {
  const n = w.nations[key];
  if (!n || n.eliminated) return 0;
  let raw = 0;
  for (const r of ownedRegions(w, key)) raw += rawPower(r.units);
  return Math.round(ownedRegions(w, key).length * 120 + raw + n.techLevel * 80 + n.money * 0.05 + n.industry * 0.1);
}
function isTruceActive(w, key) {
  if (!w || !w.truces || !w.truces[key]) return false;
  const until = w.truceUntil ? w.truceUntil[key] : null;
  return until == null || w.quarter <= until;
}
/* Elimination, one door for every path (quarter end / direct battle /
   flow resolution): the moment a nation hits 0 provinces its numbers
   go to ZERO for good — money, industry, tech points, population —
   its streams are cancelled, its offers and truces are pruned, and
   the fall is written once as an epic (chronicle) line. A dead nation
   must never again show a score, a bar, or a resource figure. */
function eliminateNation(w, nation) {
  if (!nation || nation.eliminated) return;
  nation.eliminated = true;
  nation.money = 0;
  nation.industry = 0;
  nation.techPoints = 0;
  nation.supply = 0;
  if (Array.isArray(w.flows)) w.flows = w.flows.filter((f) => f.ownerKey !== nation.key);
  if (Array.isArray(w.offers)) w.offers = w.offers.filter((k) => k !== nation.key);
  if (w.truces) delete w.truces[nation.key];
  elog(w, "epic", "☠ " + nation.name + "已退出历史舞台。");
}
function checkTierPromotion(w) {
  const score = nationScore(w, w.playerKey);
  const reached = tierForScore(score);
  const rank = (name) => TIERS.findIndex((t) => t.name === name);
  if (rank(reached) > rank(w.tier)) {
    w.tier = reached;
    elog(w, "epic", "★ 晋升：你的国家国力达到 " + score + "，晋升为「" + reached + "」！");
  }
}
function powerBreakdown(w, ownerKey, units, enemy, opts) {
  opts = opts || {};
  const base = rawPower(units);
  const myTot = Math.max(0, totalUnits(units)), foTot = Math.max(0, totalUnits(enemy));
  let cf = 1;
  if (myTot > 0 && foTot > 0) {
    cf = 1 + (units.air / myTot) * (enemy.tank / foTot) * 0.35
           + (units.tank / myTot) * (enemy.inf / foTot) * 0.30
           + (units.missile / myTot) * (enemy.air / foTot) * 0.50
           + (units.inf / myTot) * (enemy.missile / foTot) * 0.20;
  }
  const countered = base * cf;
  const nation = w.nations[ownerKey];
  const lvl = nation ? nation.techLevel : 1;
  const techPct = 4 * lvl;
  const isDef = !!(opts.region && opts.region.ownerKey === ownerKey);
  let advisorPct = 0, advMult = 1;
  if (isDef) {
    const a = advisorOf(w, ownerKey, "defense");
    if (a) { advisorPct = 3 * a.level; advMult = 1 + 0.03 * a.level; }
  }
  let terrMult = 1;
  if (isDef && opts.region) {
    const terrKey = (REGION_DEFS[opts.region.idx] || {}).terrain || "";
    if (opts.region.type === "fortress") terrMult = 1.30;
    else if (terrKey === "mountains") terrMult = 1.18;
  }
  const crossMult = opts.crossing === "sea" ? 0.80 : opts.crossing === "river" ? 0.88 : 1;
  let blunt = 1;
  if (opts.bluntAirDef && opts.bluntAirDef > 0 && myTot > 0) {
    blunt = 1 - 0.25 * ((units.air + units.missile) / myTot);
  }
  const total = countered * (1 + techPct / 100) * advMult * terrMult * crossMult * blunt;
  return { base: base, counterPct: Math.round((cf - 1) * 100), techPct: techPct, advisorPct: advisorPct,
    terrainPct: Math.round((terrMult - 1) * 100), airdefBluntPct: Math.round((blunt - 1) * 100),
    crossingPct: Math.round((crossMult - 1) * 100), total: Math.round(total) };
}
/* Master G3 weather multiplier on the ATTACKER (storm also zeroes air

function weatherAtkMult(weather) {

  if (weather === "storm") return 0.82;
  if (weather === "snow") return 0.90;
  return 1;
}
function effectivePower(w, ownerKey, units, enemy, opts) { return powerBreakdown(w, ownerKey, units, enemy, opts).total; }
function nationArmyPower(w, key) { return Math.round(effectivePower(w, key, nationUnits(w, key), emptyUnits())); }
function computeIncome(w, key, oilFactor) {
  const nation = w.nations[key];
  if (!nation) return { money: 0, industry: 0, tech: 0, supply: 0, maintenance: 0, armyMaint: 0, buildingUpkeep: 0 };
  let money = 0, industry = 0, tech = 0, supply = 0;
  let totalRaw = 0, snowRaw = 0;
  for (const r of ownedRegions(w, key)) {
    const base = REGION_TYPES[r.type] || REGION_TYPES.farm;
    let regionMoney = base.money, regionSupply = base.supply;
    if (r.type === "farm" && r.weather === "drought") { regionMoney *= 0.6; regionSupply *= 0.6; }
    if (r.weather === "clear" && (r.type === "port" || r.buildings.commerce > 0)) regionMoney *= 1.1;
    if (r.type === "oil" && r.weather === "storm") regionMoney *= 0.8;
    const b = r.buildings;
    industry += b.factory * 35;
    money += b.commerce * 45;
    const terr = (REGION_DEFS[r.idx] || {}).terrain || "";
    money += b.trade * ((r.type === "port" || terr === "coast" || terr === "island") ? 120 : 60);
    tech += b.research * 30;
    industry += b.arms * 10;
    money += regionMoney;
    supply += regionSupply;
    industry += base.industry;
    tech += base.tech;
    const rp = rawPower(r.units);
    totalRaw += rp;
    if (r.weather === "snow") snowRaw += rp;
  }
  const ecoAdv = advisorOf(w, key, "economy");
  if (ecoAdv) money *= 1 + 0.03 * ecoAdv.level;
  const sciAdv = advisorOf(w, key, "science");
  if (sciAdv) tech *= 1 + 0.05 * sciAdv.level;
  if (nation.sanctionsLeft > 0) money *= 0.5;
  const maintenance = totalRaw * 0.06 + snowRaw * 0.01;
  return { money: Math.round(money), industry: Math.round(industry), tech: Math.round(tech), supply: Math.round(supply),
    maintenance: Math.round(maintenance), armyMaint: Math.round(maintenance), buildingUpkeep: 0 };
}
function researchCost(nation) { return 100 * nation.techLevel; }
function gainAdvisorXp(w, key, role, xp) {
  const a = advisorOf(w, key, role);
  if (!a) return;
  a.xp += xp;
  const nl = Math.min(5, Math.floor(a.xp / 100));
  if (nl > a.level) {
    a.level = nl;
    if (key === w.playerKey) elog(w, "advisor", "顾问" + a.name + "升至 " + a.level + " 级，加成提升。");

function buildingCost(b, key) {

}
function totalBuildingLevels(b) { return BUILDING_KEYS.reduce((s, k) => s + b[k], 0); }
function tryBuild(w, nation, region, key) {
  if (region.buildings[key] > 0) return false;
  const cost = buildingCost(region.buildings, key);
  if (nation.money < cost.money || nation.industry < cost.industry) return false;
  nation.money -= cost.money;
  nation.industry -= cost.industry;

  let moneyCost = def.money;
  if (region.buildings.arms > 0 && (unit === "tank" || unit === "missile")) moneyCost = Math.round(moneyCost * 0.8);
  if (nation.money < moneyCost || nation.industry < def.industry || nation.supply < def.supply) return false;
  nation.money -= moneyCost;
  nation.industry -= def.industry;
  nation.supply -= def.supply;

  nation.techLevel += 1;

        const to = w.regions[nIdx];
        if (!to || to.ownerKey === nation.key) continue;
        if (to.ownerKey !== "neutral" &&
            ((nation.key === w.playerKey && isTruceActive(w, to.ownerKey)) ||
             (to.ownerKey === w.playerKey && isTruceActive(w, nation.key)))) continue;
        if (w.flows.some((f) => f.ownerKey === nation.key && f.from === from.idx && f.to === nIdx)) continue;
        const rates = flowRates(w, from.idx, nIdx, { leave: leave });
        if (rates.net <= 0.1 * thrMult) continue;
        cands.push({ from: from, to: to, rates: rates });
      }
    }
    if (!cands.length) break;
    const pref = isPlayer ? (w.targetPref || "weak") : "weak";
    sortFlowCandidates(w, nation, cands);
    let pick = cands[0];
    if (isPlayer && w.priorityTarget != null) {
      const pt = cands.find((c) => c.to.idx === w.priorityTarget);
      if (pt) pick = pt;
    }
    if (!startFlowInternal(w, nation.key, pick.from.idx, pick.to.idx, leave)) break;
    const reason = isPlayer && w.priorityTarget === pick.to.idx ? "优先目标：托管先打这里"
      : pref === "rich" ? "富省优先：先抢钱袋子" : pref === "capital" ? "直扑敌都" : pref === "near" ? "就近推进" : "趁边境空虚：守军薄弱，一举突破";
    elog(w, "battle", nation.name + " 正在进攻 " + ((w.nations[pick.to.ownerKey] || {}).name || "中立守军") + " · 「" + pick.to.name + "」（自「" + pick.from.name + "」，" + reason + "）");
    open += 1;

}
/* Player ORDERS pass (APK ensurePlayerOrders parity): priority target
   and per-province 自动进攻 orders are INDEPENDENT commands — they run
   every quarter regardless of the autopilot master switch, the attack
   host flag, and the current strategy. Default state is NO orders
   (autoAtk empty); hanging an order on a province makes this pass keep
   a stream open from it, targeting by the player's 打法 preference.
   These are system-opened flows, so the defense-tier leave applies. */
function ensurePlayerOrders(w) {
  if (!w || w.status !== "playing") return;
  const player = w.nations[w.playerKey];
  if (!player || player.eliminated) return;
  ensureFluid(w);
  const keep = (DEFENSE_TIERS[w.defenseTier] || DEFENSE_TIERS.standard).leave;
  /* ① Priority target: strongest adjacent own province (rawPower >= 30)
     opens on it; the order clears itself when the target falls. */
  if (w.priorityTarget != null) {
    const tp = w.regions[w.priorityTarget];
    if (!tp || tp.ownerKey === w.playerKey) w.priorityTarget = null;
    else if (!(tp.ownerKey !== "neutral" && isTruceActive(w, tp.ownerKey))) {
      const hasFlow = w.flows.some((f) => f.ownerKey === w.playerKey && f.to === tp.idx);
      if (!hasFlow) {
        const src = neighbors(tp.idx).map((i) => w.regions[i])
          .filter((r) => r && r.ownerKey === w.playerKey && rawPower(r.units) >= 30)
          .sort((a, b) => rawPower(b.units) - rawPower(a.units) || a.idx - b.idx)[0];
        if (src && startFlowInternal(w, w.playerKey, src.idx, tp.idx, keep)) {
          elog(w, "battle", player.name + " 正在进攻 " + ((w.nations[tp.ownerKey] || {}).name || "中立守军") + " · 「" + tp.name + "」（自「" + src.name + "」，优先目标命令）");
        }
      }
    }
  }
  /* ② 自动进攻 orders: one standing order per province (autoAtk[idx]
     === true). A province that changed hands loses its order. */
  if (!w.autoAtk || typeof w.autoAtk !== "object") w.autoAtk = {};
  for (const key of Object.keys(w.autoAtk)) {
    if (w.autoAtk[key] !== true) continue;
    const idx = Number(key);
    const ps = w.regions[idx];
    if (!ps || ps.ownerKey !== w.playerKey) { delete w.autoAtk[key]; continue; }
    if (w.flows.some((f) => f.ownerKey === w.playerKey && f.from === idx)) continue;
    if (streamsFrom(w, idx) >= MAX_STREAMS_PER_SOURCE) continue;
    const cands = [];
    for (const nIdx of neighbors(idx)) {
      const to = w.regions[nIdx];
      if (!to || to.ownerKey === w.playerKey) continue;
      if (to.ownerKey !== "neutral" && isTruceActive(w, to.ownerKey)) continue;
      if (w.flows.some((f) => f.ownerKey === w.playerKey && f.from === idx && f.to === nIdx)) continue;
      cands.push({ from: ps, to: to, rates: flowRates(w, idx, nIdx, { leave: keep }) });
    }
    if (!cands.length) continue;
    sortFlowCandidates(w, player, cands);
    const pick = cands[0];
    if (startFlowInternal(w, w.playerKey, idx, pick.to.idx, keep)) {
      elog(w, "battle", player.name + " 正在进攻 " + ((w.nations[pick.to.ownerKey] || {}).name || "中立守军") + " · 「" + pick.to.name + "」（自「" + ps.name + "」，自动进攻命令）");
    }
  }
}


/* ---------- weather ---------- */
const SEASON_WEATHER = [
  [["clear", 30], ["cloudy", 28], ["rain", 20], ["fog", 10], ["storm", 6], ["drought", 6]],
  [["clear", 28], ["cloudy", 18], ["rain", 18], ["storm", 16], ["drought", 20]],
  [["clear", 30], ["cloudy", 28], ["rain", 14], ["fog", 12], ["snow", 6], ["drought", 10]],
  [["clear", 22], ["cloudy", 28], ["snow", 28], ["fog", 12], ["rain", 6], ["storm", 4]],
];
const SEASON_TEMP = [16, 27, 17, 3];
const SEASON_NAMES = ["春", "夏", "秋", "冬"];
function rerollWeights(seasonIdx, r) {
  const table = SEASON_WEATHER[seasonIdx] || SEASON_WEATHER[0];
  const weights = new Map(table);
  const climate = REGION_DEFS[r.idx].climate || "temperate";
  const bump = (kind, delta) => { if (weights.has(kind)) weights.set(kind, Math.max(0, (weights.get(kind) || 0) + delta)); };
  if (climate === "arctic") { bump("snow", 20); bump("clear", -8); bump("drought", -6); }
  else if (climate === "tropical") { bump("rain", 10); bump("storm", 9); weights.delete("snow"); }
  else if (climate === "desert") { bump("clear", 16); bump("drought", 14); bump("rain", -8); weights.delete("snow"); }
  else if (climate === "subtropical") { bump("rain", 5); bump("snow", -4); }
  if (r.weather === "storm" || r.weather === "snow" || r.weather === "drought") {
    const cur = weights.get(r.weather);
    if (cur != null) weights.set(r.weather, Math.min(cur, 3));
  }
  if (r.type === "port") { bump("rain", 6); bump("storm", 6); }
  return weights;
}
const EXTREME_DECAY = { storm: "rain", snow: "cloudy", drought: "clear" };
function forecastFor(w, r) {
  const nextSeasonIdx = w.quarter % 4;
  const seasonName = SEASON_NAMES[nextSeasonIdx] || "";
  const weights = rerollWeights(nextSeasonIdx, r);
  let totalW = 0;
  for (const v of weights.values()) totalW += Math.max(0, v);
  totalW = Math.max(1, totalW);
  const stayTarget = EXTREME_DECAY[r.weather] || r.weather;
  const pct = new Map();
  for (const k of Object.keys(WEATHERS)) {
    const share = Math.max(0, weights.get(k) || 0) / totalW;
    pct.set(k, Math.round((0.5 * (k === stayTarget ? 1 : 0) + 0.5 * share) * 100));
  }
  let topWeather = r.weather, topPct = 0;
  for (const entry of pct) { if (entry[1] > topPct) { topPct = entry[1]; topWeather = entry[0]; } }
  const extremePct = (pct.get("storm") || 0) + (pct.get("snow") || 0) + (pct.get("drought") || 0);
  const curExtreme = r.weather === "storm" || r.weather === "snow" || r.weather === "drought";
  const summary = "下季·" + seasonName + "：最可能" + (WEATHERS[topWeather] || {}).name + "（" + topPct + "%）" +
    (extremePct >= 15 ? "，极端天气（雷暴/降雪/干旱）合计 " + extremePct + "%" : "") +
    (curExtreme ? "；当前" + (WEATHERS[r.weather] || {}).name + "多半只持续这一季" : "");
  return { nextSeason: seasonName, summary: summary, extremePct: extremePct };
}
function evolveWeather(w) {
  const season = (w.quarter - 1) % 4;
  for (const r of w.regions) {
    if (Math.random() < 0.5) {
      const options = [];
      for (const entry of rerollWeights(season, r)) if (entry[1] > 0) options.push({ item: entry[0], weight: entry[1] });
      const next = pickWeighted(options);
      if (next) r.weather = next;
    } else if (r.weather === "storm" || r.weather === "snow" || r.weather === "drought") {
      r.weather = EXTREME_DECAY[r.weather] || r.weather;
    }
    const base = SEASON_TEMP[season] != null ? SEASON_TEMP[season] : 16;
    const climate = REGION_DEFS[r.idx].climate || "temperate";
    const bandOffset = climate === "arctic" ? -9 : climate === "tropical" ? 7 : climate === "desert" ? 5 : 0;
    r.temp = Math.round(base + bandOffset + (Math.random() * 9 - 4));
    if (r.weather === "snow") r.temp = Math.min(r.temp, 1);
    if (r.weather === "storm" || r.weather === "rain") r.temp -= 2;
  }
}

/* ---------- quarter simulation ---------- */
function runQuarter(w) {
  if (w.status !== "playing") return;
  const logsAtStart = w.newLogs.length;
  w.quarter += 1;
  w.battleEvents = [];
  elog(w, "season", "—— 第 " + w.quarter + " 季度 · " + SEASON_NAMES[(w.quarter - 1) % 4] + " ——");
  evolveWeather(w);
  if (w.quarter - (w.interventions["_lastCapture"] != null ? w.interventions["_lastCapture"] : 0) >= 5 &&
      w.interventions["_droughtWarned"] == null && w.quarter > 5) {
    w.interventions["_droughtWarned"] = w.quarter;
    elog(w, "event", "边境已连续多季无领土易手，各国军方蠢蠢欲动——僵局正在被打破。");
  }
  /* Income (master E): no soft caps, no catch-up aid, no oil dice.
     Money floor 60 while the nation holds any province. */
  for (const nation of Object.values(w.nations)) {
    if (nation.eliminated) continue;
    const inc = computeIncome(w, nation.key, 1);
    nation.money += inc.money;
    nation.industry += inc.industry;
    nation.techPoints += inc.tech;
    nation.supply += inc.supply;
    nation.money -= inc.maintenance;
    if (nation.money < 60 && ownedRegions(w, nation.key).length > 0) nation.money = 60;
    if (inc.money >= 500) gainAdvisorXp(w, nation.key, "economy", 8);
    if (nation.sanctionsLeft > 0) nation.sanctionsLeft -= 1;
  }
  /* Intervention charge (master I1): +1 per quarter, cap 6. */
  w.charge = Math.min(CHARGE_MAX, (w.charge || 0) + 1);
  /* Truce expiry (master K1: 6-quarter term). */
  for (const k of Object.keys(w.truces)) {
    if (w.truces[k] && w.truceUntil && w.truceUntil[k] != null && w.quarter > w.truceUntil[k]) {
      w.truces[k] = false;
      delete w.truceUntil[k];

     master switch and the research sub-flag; the auto-upgrade the

     turning 科研 off stops the drip only, never the upgrade (APK
     parity: its upgrade runs in the income phase, ungated). */
  for (const nation of Object.values(w.nations)) {
    if (nation.eliminated) continue;
    const isPlayer = nation.key === w.playerKey;
    const dripGated = isPlayer && (!w.autopilot || (w.hostFlags && !w.hostFlags.research));
    if (!dripGated) {
      const key = stratKeyOf(w, nation);

     requires the 打仗 strategy (APK ensureAiFlows auto condition) —

  const player = w.nations[w.playerKey];
  if (player && w.autopilot && !player.eliminated) {
    developNation(w, player, w.hostFlags || { produce: true, research: true, attack: true });
    if (w.strategy === "military" && (!w.hostFlags || w.hostFlags.attack)) ensureFlows(w, player);
  }
  for (const nation of Object.values(w.nations)) {
    if (nation.key === w.playerKey || nation.eliminated) continue;

  ensurePlayerOrders(w);
  runEvent(w);
  for (const nation of Object.values(w.nations)) {
    if (nation.key === w.playerKey || nation.eliminated) continue;
    const myRegions = ownedRegions(w, nation.key).length;
    const playerRegions = ownedRegions(w, w.playerKey).length;
    const truce = isTruceActive(w, nation.key);
    if (!truce && myRegions <= 3 && playerRegions >= myRegions + 2 && Math.random() < 0.5) {
      if (!w.offers.includes(nation.key)) {

      }

    if (!truce &&
        nationArmyPower(w, nation.key) > nationArmyPower(w, w.playerKey) * 1.45 &&
        w.quarter - (w.interventions[warnKey] != null ? w.interventions[warnKey] : -99) >= 8 &&
        w.quarter - (w.interventions["_warnAny"] != null ? w.interventions["_warnAny"] : -99) >= 4 &&
        Math.random() < 0.22) {
      w.interventions[warnKey] = w.quarter;
      w.interventions["_warnAny"] = w.quarter;
      elog(w, "diplomacy", nation.name + "公开警告：其军力已明显占优，要求你「克制边境动作」——是备战信号还是虚张声势，只有下几季知道。");
    }

    if (truce && w.truceUntil && w.truceUntil[nation.key] != null && (w.truceUntil[nation.key] - w.quarter) <= 3 &&
        nation.personality === "expansion" &&
        nationArmyPower(w, nation.key) > nationArmyPower(w, w.playerKey) * 1.3 && Math.random() < 0.18) {
      w.truces[nation.key] = false;

  if (Math.random() < 0.22) {
    const others = Object.values(w.nations).filter((n) => n.key !== w.playerKey && !n.eliminated);
    if (others.length >= 2) {
      const a = others[Math.floor(Math.random() * others.length)];
      const b = others.filter((n) => n.key !== (a && a.key))[Math.floor(Math.random() * (others.length - 1))];
      if (a && b) {

          a.money += 60; b.money += 60;

        } else {

  }
  const playerRegions = ownedRegions(w, w.playerKey).length;
  if (playerRegions >= w.regions.length) {

        const partsNote = (flowP.parts && flowP.parts.length)

        if (activeFlow) {

        } else {

      h += '<p class="hint-line">流速已含地形 · 天气 · 克制（机›坦›步›导›机），不掷骰子</p>';

    h += '</div>';
  }
  return h;
}

/* ---------- growth / diplo / log sheets ---------- */
function nationScoreOf(n) { if (!n || n.eliminated) return 0; return Math.round(n.regionCount * 120 + (n.rawPower != null ? n.rawPower : n.armyPower) + n.techLevel * 80 + n.money * 0.05 + n.industry * 0.1); }
let auditCache = { key: "", html: "" };
function techStockOf(n) { return n.techPoints + 50 * n.techLevel * (n.techLevel - 1); }
function rawPowerSum(w, key) { let s = 0; for (const r of ownedRegions(w, key)) s += rawPower(r.units); return s; }
function mulberry32(seed) { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
/* Live strategy audit (P1-4): when the growth page opens, clone the
   CURRENT world once per strategy and run 20 quarters under the live
   engine with a seeded RNG; funds are the money-STOCK delta — the
   same yardstick the APK audit uses. Cached per quarter. */
function runStrategyAudit() {
  if (!world || world.status !== "playing") return "";
  const akey = world.quarter + "|" + world.playerKey;
  if (auditCache.key === akey) return auditCache.html;
  const origRandom = Math.random;
  const rows = [];
  try {
    for (const sk of ["military", "economy", "technology", "balanced"]) {
      const clone = JSON.parse(JSON.stringify(world));
      clone.strategy = sk; clone.autopilot = true;
      clone.hostFlags = { produce: true, research: true, attack: true };
      clone.newLogs = []; clone.battleEvents = [];
      Math.random = mulberry32(20261101);
      const pk = clone.playerKey;
      const before = { money: clone.nations[pk].money, army: rawPowerSum(clone, pk), tech: techStockOf(clone.nations[pk]) };
      for (let q = 0; q < 20 && clone.status === "playing"; q++) { runQuarter(clone); resolveFlows(clone, 3); }
      const after = { money: clone.nations[pk].money, army: rawPowerSum(clone, pk), tech: techStockOf(clone.nations[pk]) };
      rows.push({ sk: sk, army: Math.round(after.army - before.army), funds: Math.round(after.money - before.money), tech: Math.round(after.tech - before.tech) });
    }
  } finally { Math.random = origRandom; }
  if (!rows.length) return "";
  const best = { army: Math.max.apply(null, rows.map((r) => r.army)), funds: Math.max.apply(null, rows.map((r) => r.funds)), tech: Math.max.apply(null, rows.map((r) => r.tech)) };
  const fmtD = (v) => (v > 0 ? "+" : "") + fmt(v);
  let h = '<section class="growth-sec" aria-label="方略实效对账"><h3><span class="sec-ic" style="background:#007aff">账</span>方略实效对账</h3>';
  for (const r of rows) {
    const nm = (STRATEGIES[r.sk] || {}).name || r.sk;
    const mark = (v, b) => (v === b && v > 0 ? ' <b style="color:#ff3b30">第一</b>' : "");
    h += '<p class="adv-line"><b>' + nm + '</b> <span>军力 ' + fmtD(r.army) + mark(r.army, best.army) + ' · 钱 ' + fmtD(r.funds) + mark(r.funds, best.funds) + ' · 科研 ' + fmtD(r.tech) + mark(r.tech, best.tech) + '</span></p>';
  }
  h += '<p class="tier-note">口径：本页打开时按现行引擎实跑——当前局面克隆四份、四方略各跑 20 季；钱＝资金库存增量，军力＝全军原始战力增量，科研＝科技点产出（含升级消耗折算）。与 APK 同口径。</p></section>';
  auditCache = { key: akey, html: h };
  return h;
}
function growthSheetHTML() {

  const tiers = S.catalog.tiers;

  const tierIdx = tiers.reduce((acc, t, i) => (score >= t.min ? i : acc), 0);
  const nextTier = tiers[tierIdx + 1];
  const tierProgress = nextTier ? Math.min(1, (score - tiers[tierIdx].min) / (nextTier.min - tiers[tierIdx].min)) : 1;
  const maxArmy = Math.max(1, ...S.nations.map((n) => n.armyPower));
  const maxMoney = Math.max(1, ...S.nations.map((n) => n.money));
  const maxTech = Math.max(1, ...S.nations.map((n) => n.techLevel));
  const history = S.history;
  let chartHTML = "";
  if (history.length >= 2) {
    const step = Math.max(1, Math.ceil(history.length / 25));
    const pts = history.filter((_, i) => i % step === 0 || i === history.length - 1);
    const max = Math.max(1, ...pts.flatMap((hh) => S.nations.map((n) => hh.scores[n.key] || 0)));
    const W2 = 320, H2 = 120;
    let paths = "";
    for (const f of [0.25, 0.5, 0.75]) paths += '<line x1="0" x2="320" y1="' + (120 * f) + '" y2="' + (120 * f) + '" stroke="#eeeef2" stroke-dasharray="3 3"/>';
    for (const n of S.nations) {
      const d = pts.map((hh, i) => (i === 0 ? "M" : "L") + ((i / Math.max(1, pts.length - 1)) * W2).toFixed(1) + "," + (H2 - ((hh.scores[n.key] || 0) / max) * (H2 - 8) - 4).toFixed(1)).join(" ");
      paths += '<path d="' + d + '" fill="none" stroke="' + n.color + '" stroke-width="' + (n.isPlayer ? 2.6 : 1.7) + '" stroke-linejoin="round"/>';
    }
    chartHTML = '<svg viewBox="0 0 320 120" style="margin-top:4px;width:100%" role="img" aria-label="四国国力随季度变化曲线">' + paths + '</svg>';
  } else {
    chartHTML = '<p style="margin-top:4px;font-size:14px" class="dim">推进几个季度后，四国国力曲线会出现在这里。</p>';
  }
  let h = '<section class="growth-sec" aria-label="国家档位"><div class="tier-flex"><div><p class="lab">当前档位</p><p class="big">' + esc(S.playerTier) + '</p></div>' +
    '<div style="text-align:right"><p class="lab">综合国力</p><p class="big">' + fmt(score) + '</p></div></div>' +
    '<div class="tier-bar"><div style="width:' + (tierProgress * 100) + '%"></div></div>' +
    '<p class="tier-note">' + (nextTier ? "距「" + nextTier.name + "」还差 " + fmt(nextTier.min - score) + " 分国力" : "已是最高档位——超级大国") + '</p></section>';
  h += '<section class="growth-sec" aria-label="四国国力曲线"><h3><span class="sec-ic" style="background:#ff9500">趋</span>四国国力曲线</h3>' + chartHTML + '</section>';

      '<p class="rank-sub">' + n.regionCount + ' 省 · ' + (n.isPlayer ? '方略 ' + esc((S.catalog.strategies[S.strategy] || {}).name || "") : esc(n.personalityName)) + (n.eliminated ? " · 已灭亡" : "") + '</p>';

    '<div class="tier-bar"><div style="width:' + rcPct + '%"></div></div>' +

      const lv = (r.buildings || {})[k] || 0, def = S.catalog.buildings[k];

function situationSheetHTML() {
  // 局势 = 对手状态（只读）+ 停战提议（待处理）+ 事件流（编年史与战报合并的一条流）。
  let h = "";
  if (S.offers.length) {
    h += '<div style="margin-bottom:12px">';
    for (const k of S.offers) {
      const n = S.nations.find((x) => x.key === k);
      h += '<div class="offer-row"><p>' + esc(n ? n.name : "") + ' 请求停战</p><div class="offer-btns">' +
        '<button type="button" class="accept-btn" data-act="offer" data-key="' + k + '" data-accept="1">接受</button>' +
        '<button type="button" class="decline-btn" data-act="offer" data-key="' + k + '" data-accept="0">拒绝</button></div></div>';
    }
    h += '</div>';
  }
  /* Strength ranking: name + score on ONE line (score never wraps),
     detail line under it, bar under that. */
  const tierNameOf = (sc) => S.catalog.tiers.reduce((acc, t) => (sc >= t.min ? t.name : acc), S.catalog.tiers[0].name);
  const ranked = S.nations.slice().sort((a, b) => nationScoreOf(b) - nationScoreOf(a));
  const maxScore = Math.max(1, nationScoreOf(ranked[0]));
  h += '<section class="growth-sec" aria-label="四国实力榜"><h3><span class="sec-ic" style="background:#ff9500">榜</span>四国实力榜</h3>';
  for (const n of ranked) {
    if (n.eliminated) {
      // Dead nation: ONE line, no score, no bar, no figures — ever.
      h += '<div style="margin-bottom:10px"><div class="rank-head"><p class="rank-name"><span class="dot" style="background-color:' + n.color + '"></span>' + esc(n.name) + (n.isPlayer ? '<span class="me-badge">我</span>' : "") +
        '</p><span class="gone">已灭亡</span></div></div>';
      continue;
    }
    const sc = nationScoreOf(n);
    h += '<div style="margin-bottom:10px"><div class="rank-head"><p class="rank-name"><span class="dot" style="background-color:' + n.color + '"></span>' + esc(n.name) + (n.isPlayer ? '<span class="me-badge">我</span>' : "") +
      '</p><span class="rank-score"><span class="lab">国力</span>' + fmt(sc) + '</span></div>' +
      '<p class="rank-sub">' + esc(tierNameOf(sc)) + ' · ' + n.regionCount + ' 省 · 兵 ' + fmt(n.armyPower) + (n.isPlayer ? ' · 方略 ' + esc((S.catalog.strategies[S.strategy] || {}).name || "") : "") + '</p>' +
      '<div class="bar-track" style="margin-top:4px"><div style="background-color:' + n.color + ';width:' + Math.max(3, (sc / maxScore) * 100) + '%"></div></div></div>';
  }
  h += '</section>';
  h += '<div style="margin-bottom:12px">';
  const meN = S.nations.find((x) => x.isPlayer);
  if (meN) {
    h += '<div class="diplo-row me-row"><div><p class="nm"><span class="dot" style="background-color:' + meN.color + '"></span>' + esc(meN.name) +
      '<span class="me-badge">我</span></p>' +
      '<p class="sub">' + meN.regionCount + ' 省 · 兵 ' + fmt(meN.armyPower) + ' · 钱 ' + fmt(meN.money) + ' · 科技 ' + meN.techLevel + ' 级 · 方略 ' + esc((S.catalog.strategies[S.strategy] || {}).name || "") + (S.autopilot ? "" : " · 手动") + '</p></div></div>';
  }
  for (const n of S.nations.filter((x) => !x.isPlayer)) {
    const d = S.diplomacy.find((x) => x.aiKey === n.key);
    const truce = d ? d.truce : false;
    h += '<div class="diplo-row"><div><p class="nm"><span class="dot" style="background-color:' + n.color + '"></span>' + esc(n.name) +
      (n.eliminated ? '<span class="gone">已灭亡</span>' : "") + '</p>' +
      '<p class="sub">' + (n.eliminated ? "已灭亡 · 0 省" : esc(n.personalityName) + ' · ' + n.regionCount + ' 省 · 兵 ' + fmt(n.armyPower) + ' · 钱 ' + fmt(n.money) + ' · 科技 ' + n.techLevel + ' 级 · ' + (truce ? "停战中" : "交战中")) + '</p></div></div>';
  }
  h += '</div>';
  const logs = S.logs.slice(0, UI.logCount);
  h += '<div>';
  if (!logs.length) h += '<p class="empty-note">还没有动态，时间流过第一季就有了。</p>';
  for (const l of logs) {
    const kind = LOG_KIND_LABEL[l.kind] || { label: l.kind, color: "#8e8e93" };
    h += '<button type="button" class="log-row" data-act="locate" data-text="' + esc(l.text) + '"><span class="log-kind" style="background-color:' + kind.color + '">' + kind.label + '</span>' +
      '<span class="log-text"><span class="q">第' + l.quarter + '季</span>' + esc(l.text) + '</span></button>';
  }
  h += '</div>';
  if (S.logs.length > UI.logCount) {
    h += '<button type="button" class="log-more" data-act="log-more">加载更早的动态（已显示 ' + UI.logCount + '/' + S.logs.length + '）</button>';
  }
  h += '<div class="restart-row">';
  if (UI.confirmRestart) {
    h += '<span class="ask"><span class="danger">确定放弃当前存档？</span><button type="button" class="confirm" data-act="restart-confirm">确认放弃</button><button type="button" data-act="restart-cancel" style="font-size:14px" class="dim">取消</button></span>';
  } else {
    h += '<button type="button" class="restart-link" data-act="restart-ask">放弃存档 · 重新开始</button>';
  }
  h += '</div>';
  return h;
}

   is checked every frame; crossing into a new nearest segment switches
   the VALUE on the spot (segFollowApply — strategy / speed / count take
   effect immediately, crossing back switches back). Release performs
   the 400ms magnet snap only. Clicks (no drag) keep the spring path. */

    const pill = el.querySelector(".seg-pill");
    if (!pill) return null;
    const tr = getComputedStyle(pill).transform;
    if (!tr || tr === "none") return st && st._restLeft != null ? st._restLeft : null;
    try { return new DOMMatrixReadOnly(tr).e; }
    catch (err) { return null; }
  }

    el.querySelectorAll(".seg-btn").forEach((b, i) => {
      const sel = !!(st.options[i] && st.options[i].key === key);
      b.classList.toggle("sel", sel);
      b.setAttribute("aria-pressed", sel ? "true" : "false");
    });

  function paintSegSel(el, st) { paintSegSelKey(el, st, st.value); }

    if (!st.onChange) return;
    requestAnimationFrame(() => { try { st.onChange(key); } catch (err) {} });
  }

    if (active) return; // primary finger already owns a seg gesture
    const el = e.target.closest ? e.target.closest("[data-seg]") : null;
    if (!el) return;
    const id = el.getAttribute("data-seg");
    const st = segs[id];
    if (!st || !st.options) return;
    layoutSeg(el);
    st._colorGen = (st._colorGen || 0) + 1; // a new press supersedes color tracking
    // Cancel any in-flight slide but KEEP the pill's on-screen position.
    const v = visualLeft(el, st);
    active = { id: id, el: el, pid: e.pointerId, startX: e.clientX, startY: e.clientY, moved: 0, dragging: false, yielded: false, followKey: null, startKey: st.value, pressLeft: v != null ? v : (st._restLeft || 2) };

    if (!st || !st._segW) return;

    active.moved = Math.max(active.moved, Math.abs(dx));
    if (!active.dragging) {
      // Direction gate on the ACCUMULATED displacement vector, decided
      // once at 10px. The old per-event check yielded forever whenever
      // the first move under a real thumb happened to lean vertical
      // (|dy| > 8 and |dy| > |dx| on ONE event), killing the whole drag
      // before it started. A mostly-vertical gesture belongs to page
      // scroll: yield it untouched (no magnet, no commit). Once the
      // vector says horizontal, the drag is locked and never yields.
      const adx = Math.abs(dx), ady = Math.abs(dy);

      if (ady > adx) { active.yielded = true; return; }
      active.dragging = true;

    // the finger's DISPLACEMENT from its press-time visual position — never
    // absolute finger-centering — so grabbing off-center cannot jump.
    st.dragLeft = Math.max(2, Math.min(st._w - 2 - st._pillW, active.pressLeft + (e.clientX - active.startX)));

    // AND the value itself switches the moment the pill's ACTUAL center
    // crosses into a new nearest segment: st.value flips, the bold class
    // lands, and segFollowApply makes the effect real NOW (strategy is
    // written to the world, speed drives the clock, count is live).

    // segment never re-fires. Only this element's DOM rebuild waits for
    // release (it holds the pointer capture — see render-hold note).

    if (st && st._segW && el && !a.yielded) {

        // follow-switched during the drag. Target = nearest segment to
        // the pill's ACTUAL center at the release instant (ties ->
        // smaller index). If the resting center sits in a segment the
        // last move frame had not crossed into (lift between moves),
        // that is a final follow crossing — apply it like any other —
        // then glide home, ending with pill center == segment center.
        const target = nearestCenterIdx(st.dragLeft + st._pillW / 2, centers);
        const key = target >= 0 && st.options[target] ? st.options[target].key : null;
        if (key && key !== st.value) {
          const prevKey = st.value;
          st.value = key;
          paintSegSel(el, st);
          noteFollow("seg:" + a.id, prevKey, key, st.dragLeft + st._pillW / 2);
          segFollowApply(a.id, st, key);

        else {

          // it lands (a rebuild would replace this element mid-glide).
          st.trans = "transform 400ms " + MAGNET_CSS; st.dragLeft = null; layoutSeg(el); trackSegColors(a.id, 430);
          holdGlide(430);

        // ENDS on a different strategy than it started on, emit the one
        // standard log line now (cross-and-return ends silent).

      } else {

        const rect = el.getBoundingClientRect();
        const x = e.clientX - rect.left;

        const key = target >= 0 && st.options[target] ? st.options[target].key : null;
        if (key && key !== st.value) {
          const cur = visualLeft(el, st);
          st.dragLeft = cur != null ? cur : (st._restLeft || 2);
          st.trans = "none";
          layoutSeg(el);
          void el.offsetWidth;
          st.value = key;
          st.dragLeft = null;
          st.trans = "transform 550ms " + SPRING_CSS;
          layoutSeg(el);
          paintSegSel(el, st);
          trackSegColors(a.id, 580);
          holdGlide(580); // same protection: the spring must be seen too

    if (!active) return;

    const a = active;
    active = null;
    const st = segs[a.id];
    // Interrupted mid-drag (scroll takeover / system gesture): a cancel
    // adds no NEW switch, but follow switches already made during the
    // drag stand — settle the pill onto the CURRENT value's segment
    // with the magnet curve.
    if (st && st._segW && st.dragLeft != null) {
      const el = segEl(a.id) || a.el;
      if (el) {
        const curIdx = Math.max(0, st.options.findIndex((o) => o.key === st.value));
        const rest = 2 + curIdx * st._segW;
        st.trans = Math.abs(st.dragLeft - rest) < 0.5 ? "none" : "transform 400ms " + MAGNET_CSS;
        st.dragLeft = null;
        layoutSeg(el);
        if (a.id === "strategy" && a.startKey != null && st.value !== a.startKey) fireChange(st, st.value);
      } else st.dragLeft = null;
    }
    holdGestureEnd();
  };
  document.addEventListener("pointerup", up);
  document.addEventListener("pointercancel", cancel);

  // scrolling can never steal the gesture mid-flight.
  document.addEventListener("touchmove", (e) => { if (active && active.dragging) e.preventDefault(); }, { passive: false });
})();

        d0: Math.max(10, Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y)),

/* ---------- sheet swipe-down to dismiss ----------

   only); past 64px it dismisses through the same spring-out door as
   every other close path, short of that it springs back with the
   overshoot curve. */

    const sheet = grab.closest(".sheet");
    if (!wrap || !sheet) return;

    sheet.classList.remove("sheet-in");

  });

    if (!g || e.pointerId !== g.pid) return;
    g.dy = Math.max(0, e.clientY - g.startY);
    g.sheet.style.transform = "translateY(" + g.dy + "px)";
  });
  const end = (e) => {
    if (!g || (e && e.pointerId !== g.pid)) return;
    const cur = g; g = null;
    if (cur.dy > 64) {
      cur.sheet.style.transition = "";
      cur.sheet.style.transform = "";
      animateCloseSheet(cur.wrap.getAttribute("data-close") || "close-sheet");
    } else {
      cur.sheet.style.transition = "transform 340ms cubic-bezier(0.34,1.56,0.64,1)";
      cur.sheet.style.transform = "translateY(0px)";
      setTimeout(() => { cur.sheet.style.transition = ""; cur.sheet.style.transform = ""; }, 360);
    }
  };
  document.addEventListener("pointerup", end);
  document.addEventListener("pointercancel", end);
})();

/* ---------- boot ---------- */

     strip on wide screens). Only their real children opt back in:
     .hud-inner > *, .rail > *, .controlbar .panel. */
  document.head.appendChild(style);
  const saved = loadSave();
  if (saved) restoreSave(saved);
  const initial = actGetState();
  setState(initial);
  window.addEventListener("resize", () => { layoutAllSegs(); layoutDock(); });
})();

</script>
